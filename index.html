<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Garten-Imperium — vom Kräuterbeet zum Garten-Imperium. Ein Browser-Idle-Game." />
    <meta name="theme-color" content="#090a14" />
    <title>Garten-Imperium 🌿</title>
    <style>
      /* avoid a white flash before the bundle loads */
      html {
        background: #090a14;
      }
      /* Boot-Screen (PHASE 96): steht direkt im HTML, wird also gemalt BEVOR das
         Modul lädt und der Offline-Nachhol-Lauf den Thread blockiert. Ohne ihn
         starrt ein Rückkehrer auf eine leere Seite und hält das Spiel für kaputt.
         main.ts entfernt ihn, sobald die App gemountet ist. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #090a14;
        color: #75a743;
        font-family: 'Pixelify Sans', ui-monospace, monospace;
        text-align: center;
        z-index: 9999;
      }
      #boot .sprout {
        font-size: 3rem;
        line-height: 1;
        animation: boot-sway 1.6s ease-in-out infinite;
      }
      #boot p {
        margin: 0;
        font-size: 0.95rem;
        letter-spacing: 0.04em;
      }
      #boot .sub {
        color: #577277;
        font-size: 0.78rem;
      }
      @keyframes boot-sway {
        0%,
        100% {
          transform: rotate(-6deg);
        }
        50% {
          transform: rotate(6deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .sprout {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="sprout">🌱</div>
      <p>Garten wird geladen …</p>
      <p class="sub">Abwesenheit wird nachgeholt</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
