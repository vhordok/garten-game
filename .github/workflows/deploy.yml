# Baut das Spiel und veröffentlicht dist/ auf GitHub Pages.
# Läuft bei jedem Push auf den Default-Branch sowie manuell (workflow_dispatch).

name: Deploy zu GitHub Pages

on:
  push:
    branches: ['claude/dreamy-curie-tivp61']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Deploys parallel; bei neuem Push wird der laufende abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          # legt die Pages-Site automatisch an, falls noch nicht aktiviert
          enablement: true

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Pages serviert unter https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
